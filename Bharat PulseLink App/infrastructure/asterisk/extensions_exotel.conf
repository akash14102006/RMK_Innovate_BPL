; ============================================================================
; BHARAT PULSELINK — MODULAR EXOTEL INBOUND DIALPLAN
; File: infrastructure/asterisk/extensions_exotel.conf
; Target: Asterisk 22.5.2 on AWS EC2 (52.205.228.23)
; Context: [exotel-inbound] (Inbound Only, Zero Outbound, Toll Fraud Defense)
; ============================================================================

[exotel-inbound]
; Route incoming call on ExoPhone 08040265947 or canonical +918040265947
exten => _+918040265947,1,NoOp(--- INBOUND EXOTEL CALL: ${CALLERID(num)} -> ${EXTEN} ---)
 same => n,Set(CHANNEL(hangup_handler_push)=sub-exotel-cleanup,s,1)
 same => n,Set(TIMEOUT(absolute)=600)  ; 10 minutes maximum duration
 same => n,Answer(500)
 same => n,Wait(1)
 ; Hand off to Bharat PulseLink IVR Fastify Engine via Stasis / HTTP
 same => n,Stasis(bharat-pulselink-ivr,${CALLERID(num)},${EXTEN},${CHANNEL(uniqueid)})
 same => n,Hangup()

exten => 08040265947,1,Goto(_+918040265947,1)
exten => 8040265947,1,Goto(_+918040265947,1)

; Fallback for any valid Indian mobile number prefix dialed to trunk
exten => _+91X.,1,Goto(_+918040265947,1)

; FAIL-SAFE: If backend IVR service is unreachable, play clean fallback prompt
exten => e,1,NoOp(--- IVR BACKEND CONNECTION FAILURE ---)
 same => n,Playback(bharat-pulselink/en/hospital-search-error)
 same => n,Hangup()

; CATCH-ALL & TOLL FRAUD DEFENSE: Reject internal extensions & outbound numbers
exten => _[0-9].,1,NoOp(--- UNAUTHORIZED EXTENSION ATTEMPT: ${EXTEN} REJECTED ---)
 same => n,Playback(ss-noservice)
 same => n,Hangup(21)  ; Cause 21: Call Rejected

[sub-exotel-cleanup]
exten => s,1,NoOp(--- EXOTEL CALL CLEANUP: ${CHANNEL(uniqueid)} ---)
 same => n,Return()
