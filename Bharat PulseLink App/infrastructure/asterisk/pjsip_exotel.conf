; ============================================================================
; BHARAT PULSELINK — MODULAR EXOTEL PJSIP CONFIGURATION
; File: infrastructure/asterisk/pjsip_exotel.conf
; Target: Asterisk 22.5.2 on AWS EC2 (52.205.228.23)
; Integration: Exotel Virtual SIP Trunking (vSIP) over TCP (Port 5070)
; ============================================================================

; --- Transport: SIP over TCP on Port 5070 ---
[transport-tcp-exotel]
type=transport
protocol=tcp
bind=0.0.0.0:5070
local_net=172.31.0.0/16
external_signaling_address=52.205.228.23
external_media_address=52.205.228.23

; --- Exotel Inbound Endpoint ---
[exotel-trunk]
type=endpoint
transport=transport-tcp-exotel
context=exotel-inbound
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
timers=yes
timers_min_se=90
timers_sess_expires=1800
acl=exotel-ip-acl
aors=exotel-aor

; --- IP Allowlist for Exotel SBCs ---
[exotel-ip-acl]
type=acl
permit=127.0.0.1/32
permit=172.31.0.0/16
; Add Exotel official SBC CIDR blocks once received from Exotel support
; e.g. permit=103.xxx.xxx.xxx/24

; --- Address of Record ---
[exotel-aor]
type=aor
max_contacts=10
qualify_frequency=30

; --- Identify Exotel Traffic by Source IP ---
[exotel-identify]
type=identify
endpoint=exotel-trunk
match=172.31.0.0/16,127.0.0.1
; Once official Exotel SBC IPs are known: match=103.xxx.xxx.xxx/24
