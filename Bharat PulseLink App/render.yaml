services:
  # ---------------------------------------------------------------------------
  # Bharat PulseLink - Fastify API (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: bharat-pulselink-api
    runtime: node
    region: singapore
    plan: starter
    branch: main

    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/scripts/migrate-and-start.js

    healthCheckPath: /health

    envVars:
      # Runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: API_PREFIX
        value: /api/v1
      - key: SHUTDOWN_TIMEOUT_MS
        value: 15000
      - key: REQUEST_BODY_LIMIT_BYTES
        value: 1048576

      # Database - set in Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MIN
        value: 2
      - key: DATABASE_POOL_MAX
        value: 10
      - key: DATABASE_POOL_IDLE_TIMEOUT_MS
        value: 30000
      - key: DATABASE_ACQUIRE_TIMEOUT_MS
        value: 10000
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: 10000

      # Redis - set in Render dashboard
      - key: REDIS_URL
        sync: false
      - key: REDIS_REQUIRED
        value: "false"

      # CORS
      - key: CORS_ORIGINS
        value: https://hospital.bharatpulselink.in,https://admin.bharatpulselink.in,exp://

      # Descope Auth - set in Render dashboard
      - key: DESCOPE_PROJECT_ID
        sync: false
      - key: DESCOPE_MANAGEMENT_KEY
        sync: false

      # Storage
      - key: STORAGE_PROVIDER
        value: local

      # Google APIs - set in Render dashboard
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Notifications - set in Render dashboard
      - key: FCM_SERVER_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

      # Observability
      - key: OTEL_SERVICE_NAME
        value: bharat-pulselink-api

      # Blockchain disabled for MVP
      - key: BLOCKCHAIN_PROVIDER
        value: disabled
